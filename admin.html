<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Zxpmob</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Vazirmatn:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root {
    --bg: #060613; --surface: #11112a; --surface-solid: #16163a; --border: #26264c;
    --text: #eef0ff; --text-muted: #9797bb; --text-dim: #6a6a8f; --violet: #a78bfa;
    --grad: linear-gradient(135deg, #7c6cf6 0%, #4f8cff 100%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); font-family: 'Vazirmatn', sans-serif;
    min-height: 100vh; padding: 24px;
  }
  .center-screen { min-height: 90vh; display: flex; align-items: center; justify-content: center; }
  .wrap { width: 100%; max-width: 480px; margin: 0 auto; }
  .wrap.wide { max-width: 920px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 34px 30px;
  }
  .logo { font-weight: 800; font-size: 1.3rem; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 6px; display: block; text-align: center; }
  .subtitle { text-align: center; color: var(--text-dim); font-size: .85rem; margin-bottom: 26px; }
  input, textarea {
    width: 100%; padding: 13px 16px; background: var(--surface-solid); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-family: inherit; font-size: .92rem; margin-bottom: 12px;
  }
  textarea { resize: vertical; min-height: 80px; }
  input:focus, textarea:focus { outline: none; border-color: var(--violet); }
  button {
    padding: 13px; border: none; border-radius: 10px; background: var(--grad); color: #fff;
    font-family: inherit; font-weight: 700; font-size: .92rem; cursor: pointer; transition: opacity .2s ease;
  }
  button.full { width: 100%; }
  button:hover { opacity: .92; }
  button:disabled { opacity: .5; cursor: default; }
  .error-msg { color: #ff8a8a; font-size: .82rem; margin-top: 10px; text-align: center; min-height: 1em; }
  .success-msg { color: #6ee7a7; font-size: .82rem; margin-top: 10px; text-align: center; min-height: 1em; }
  .config-warning {
    background: rgba(255,138,138,.08); border: 1px solid rgba(255,138,138,.3); color: #ff8a8a;
    padding: 14px 16px; border-radius: 10px; font-size: .82rem; margin-bottom: 20px; line-height: 1.8;
  }

  .dash-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
  .dash-title { font-weight: 800; font-size: 1.3rem; }
  .dash-actions { display: flex; gap: 10px; }
  .btn-ghost {
    width: auto; padding: 9px 16px; background: var(--surface-solid); border: 1px solid var(--border);
    color: var(--text-muted); font-size: .82rem; font-weight: 600;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--violet); }

  .tab-nav { display: flex; gap: 8px; margin-bottom: 24px; background: var(--surface); border-radius: 10px; padding: 4px; flex-wrap: wrap; }
  .tab-btn { flex: 1; min-width: 110px; padding: 10px; border-radius: 8px; background: transparent; color: var(--text-muted); font-size: .84rem; font-weight: 600; }
  .tab-btn.active { background: var(--grad); color: #fff; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .msg-list, .proj-list { display: flex; flex-direction: column; gap: 12px; }
  .msg-card, .proj-card { background: var(--surface-solid); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
  .msg-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
  .msg-name { font-weight: 700; }
  .msg-email { font-family: 'JetBrains Mono', monospace; font-size: .78rem; color: var(--violet); }
  .msg-date { font-size: .74rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
  .msg-body { color: var(--text-muted); font-size: .9rem; white-space: pre-wrap; line-height: 1.7; }
  .empty-state { text-align: center; color: var(--text-dim); padding: 60px 20px; font-size: .92rem; }
  .loading { text-align: center; color: var(--text-dim); padding: 40px; font-size: .9rem; }

  .proj-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .proj-title { font-weight: 700; font-size: 1rem; }
  .proj-desc { color: var(--text-muted); font-size: .88rem; margin-bottom: 8px; }
  .proj-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .proj-tags span { font-family: 'JetBrains Mono', monospace; font-size: .7rem; padding: 3px 9px; border-radius: 100px; background: rgba(167,139,250,.1); color: var(--violet); }
  .proj-link { font-size: .8rem; color: var(--violet); word-break: break-all; }
  .btn-delete {
    background: rgba(255,138,138,.1); color: #ff8a8a; border: 1px solid rgba(255,138,138,.3);
    padding: 7px 14px; font-size: .78rem; font-weight: 600; flex-shrink: 0;
  }
  .btn-delete:hover { background: rgba(255,138,138,.18); opacity: 1; }

  .add-proj-form { background: var(--surface-solid); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .add-proj-form h3 { font-size: .95rem; margin-bottom: 14px; }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-box { background: var(--surface-solid); border: 1px solid var(--border); border-radius: 12px; padding: 22px; text-align: center; }
  .stat-box .num { font-family: 'JetBrains Mono', monospace; font-size: 2rem; font-weight: 700; color: var(--violet); display: block; margin-bottom: 6px; }
  .stat-box .label { font-size: .8rem; color: var(--text-dim); }

  .pw-form { max-width: 380px; }
</style>
</head>
<body>

  <div class="center-screen" id="configWrap" style="display:none;">
    <div class="wrap">
      <div class="card">
        <span class="logo">Zxpmob</span>
        <div class="config-warning">
          اطلاعات Supabase هنوز توی <code>supabase-config.js</code> تنظیم نشده. اول SUPABASE_URL و SUPABASE_ANON_KEY رو پر کن، بعد این صفحه رو دوباره باز کن.
        </div>
      </div>
    </div>
  </div>

  <div class="center-screen" id="loginWrap" style="display:none;">
    <div class="wrap">
      <div class="card">
        <span class="logo">Zxpmob</span>
        <p class="subtitle">ورود به پنل مدیریت</p>
        <input type="email" id="loginEmail" placeholder="ایمیل" autocomplete="username">
        <input type="password" id="loginPassword" placeholder="رمز عبور" autocomplete="current-password">
        <button class="full" id="loginBtn">ورود</button>
        <p class="error-msg" id="loginError"></p>
      </div>
    </div>
  </div>

  <div class="wrap wide" id="dashWrap" style="display:none;">
    <div class="dash-header">
      <span class="dash-title">پنل مدیریت</span>
      <div class="dash-actions">
        <button class="btn-ghost" id="refreshBtn">به‌روزرسانی</button>
        <button class="btn-ghost" id="logoutBtn">خروج</button>
      </div>
    </div>

    <div class="tab-nav">
      <button class="tab-btn active" data-tab="messages">پیام‌ها</button>
      <button class="tab-btn" data-tab="projects">پروژه‌ها</button>
      <button class="tab-btn" data-tab="stats">آمار بازدید</button>
      <button class="tab-btn" data-tab="settings">تغییر رمز</button>
    </div>

    <!-- MESSAGES TAB -->
    <div class="tab-panel active" id="panel-messages">
      <div class="msg-list" id="msgList">
        <div class="loading">در حال بارگذاری...</div>
      </div>
    </div>

    <!-- PROJECTS TAB -->
    <div class="tab-panel" id="panel-projects">
      <div class="add-proj-form">
        <h3>افزودن پروژه‌ی جدید</h3>
        <input type="text" id="projTitle" placeholder="عنوان پروژه">
        <textarea id="projDesc" placeholder="توضیح کوتاه"></textarea>
        <input type="text" id="projTags" placeholder="تگ‌ها (با کاما جدا کن، مثلاً: Python, CLI, SQLite)">
        <input type="text" id="projLink" placeholder="لینک گیت‌هاب یا دمو (اختیاری)">
        <button class="full" id="addProjBtn">افزودن پروژه</button>
        <p class="error-msg" id="projFormError"></p>
      </div>
      <div class="proj-list" id="projList">
        <div class="loading">در حال بارگذاری...</div>
      </div>
    </div>

    <!-- STATS TAB -->
    <div class="tab-panel" id="panel-stats">
      <div class="stats-grid" id="statsGrid">
        <div class="loading">در حال بارگذاری...</div>
      </div>
    </div>

    <!-- SETTINGS TAB -->
    <div class="tab-panel" id="panel-settings">
      <div class="add-proj-form pw-form">
        <h3>تغییر رمز عبور</h3>
        <input type="password" id="newPassword" placeholder="رمز عبور جدید (حداقل ۶ کاراکتر)">
        <input type="password" id="confirmPassword" placeholder="تکرار رمز عبور جدید">
        <button class="full" id="changePwBtn">ثبت رمز جدید</button>
        <p class="error-msg" id="pwError"></p>
        <p class="success-msg" id="pwSuccess"></p>
      </div>
    </div>
  </div>

<script>
const configWrap = document.getElementById('configWrap');
const loginWrap = document.getElementById('loginWrap');
const dashWrap = document.getElementById('dashWrap');

const isConfigured = typeof SUPABASE_URL !== 'undefined' &&
  SUPABASE_URL && !SUPABASE_URL.includes('YOUR-PROJECT');

if (!isConfigured) {
  configWrap.style.display = 'flex';
} else {
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleString('fa-IR', { dateStyle: 'medium', timeStyle: 'short' });
  }

  function showLogin() {
    dashWrap.style.display = 'none';
    loginWrap.style.display = 'flex';
  }

  async function showDashboard() {
    loginWrap.style.display = 'none';
    dashWrap.style.display = 'block';
    await Promise.all([loadMessages(), loadProjects(), loadStats()]);
  }

  // ---------- LOGIN ----------
  document.getElementById('loginBtn').addEventListener('click', attemptLogin);
  document.getElementById('loginPassword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') attemptLogin();
  });

  async function attemptLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorEl = document.getElementById('loginError');
    errorEl.textContent = '';

    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      errorEl.textContent = 'ورود ناموفق بود — ایمیل یا رمز اشتباهه.';
      return;
    }
    showDashboard();
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    showLogin();
  });

  sb.auth.getSession().then(({ data }) => {
    if (data.session) showDashboard();
    else showLogin();
  });

  // ---------- TABS ----------
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  document.getElementById('refreshBtn').addEventListener('click', () => {
    loadMessages(); loadProjects(); loadStats();
  });

  // ---------- MESSAGES ----------
  async function loadMessages() {
    const listEl = document.getElementById('msgList');
    listEl.innerHTML = '<div class="loading">در حال بارگذاری...</div>';

    const { data, error } = await sb.from('messages').select('*').order('created_at', { ascending: false });

    if (error) {
      listEl.innerHTML = `<div class="empty-state">خطا در دریافت پیام‌ها: ${error.message}</div>`;
      return;
    }
    if (!data || data.length === 0) {
      listEl.innerHTML = '<div class="empty-state">هنوز پیامی ثبت نشده.</div>';
      return;
    }
    listEl.innerHTML = data.map(m => `
      <div class="msg-card">
        <div class="msg-top">
          <span class="msg-name">${escapeHtml(m.name)}</span>
          <span class="msg-email">${escapeHtml(m.email)}</span>
          <span class="msg-date">${formatDate(m.created_at)}</span>
        </div>
        <div class="msg-body">${escapeHtml(m.message)}</div>
      </div>
    `).join('');
  }

  // ---------- PROJECTS ----------
  async function loadProjects() {
    const listEl = document.getElementById('projList');
    listEl.innerHTML = '<div class="loading">در حال بارگذاری...</div>';

    const { data, error } = await sb.from('projects').select('*').order('created_at', { ascending: false });

    if (error) {
      listEl.innerHTML = `<div class="empty-state">خطا در دریافت پروژه‌ها: ${error.message}</div>`;
      return;
    }
    if (!data || data.length === 0) {
      listEl.innerHTML = '<div class="empty-state">هنوز پروژه‌ای اضافه نشده — سایت به‌جاش نمونه‌های پیش‌فرض رو نشون می‌ده.</div>';
      return;
    }
    listEl.innerHTML = data.map(p => `
      <div class="proj-card">
        <div class="proj-top">
          <span class="proj-title">${escapeHtml(p.title)}</span>
          <button class="btn-delete" data-id="${p.id}">حذف</button>
        </div>
        <div class="proj-desc">${escapeHtml(p.description || '')}</div>
        <div class="proj-tags">${(p.tags || '').split(',').filter(Boolean).map(t => `<span>${escapeHtml(t.trim())}</span>`).join('')}</div>
        ${p.link ? `<div class="proj-link">${escapeHtml(p.link)}</div>` : ''}
      </div>
    `).join('');

    listEl.querySelectorAll('.btn-delete').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('این پروژه حذف بشه؟')) return;
        await sb.from('projects').delete().eq('id', btn.dataset.id);
        loadProjects();
      });
    });
  }

  document.getElementById('addProjBtn').addEventListener('click', async () => {
    const errorEl = document.getElementById('projFormError');
    errorEl.textContent = '';

    const title = document.getElementById('projTitle').value.trim();
    const description = document.getElementById('projDesc').value.trim();
    const tags = document.getElementById('projTags').value.trim();
    const link = document.getElementById('projLink').value.trim();

    if (!title) {
      errorEl.textContent = 'عنوان پروژه رو وارد کن.';
      return;
    }

    const { error } = await sb.from('projects').insert({ title, description, tags, link });
    if (error) {
      errorEl.textContent = 'خطا: ' + error.message;
      return;
    }

    document.getElementById('projTitle').value = '';
    document.getElementById('projDesc').value = '';
    document.getElementById('projTags').value = '';
    document.getElementById('projLink').value = '';
    loadProjects();
  });

  // ---------- STATS ----------
  async function loadStats() {
    const gridEl = document.getElementById('statsGrid');
    gridEl.innerHTML = '<div class="loading">در حال بارگذاری...</div>';

    const { count: totalViews, error: err1 } = await sb
      .from('page_views').select('*', { count: 'exact', head: true });

    const since24h = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
    const { count: views24h } = await sb
      .from('page_views').select('*', { count: 'exact', head: true }).gte('created_at', since24h);

    const { count: totalMessages } = await sb
      .from('messages').select('*', { count: 'exact', head: true });

    if (err1) {
      gridEl.innerHTML = `<div class="empty-state">خطا در دریافت آمار: ${err1.message}</div>`;
      return;
    }

    gridEl.innerHTML = `
      <div class="stat-box"><span class="num">${totalViews ?? 0}</span><span class="label">کل بازدیدها</span></div>
      <div class="stat-box"><span class="num">${views24h ?? 0}</span><span class="label">بازدید ۲۴ ساعت اخیر</span></div>
      <div class="stat-box"><span class="num">${totalMessages ?? 0}</span><span class="label">کل پیام‌ها</span></div>
    `;
  }

  // ---------- CHANGE PASSWORD ----------
  document.getElementById('changePwBtn').addEventListener('click', async () => {
    const errorEl = document.getElementById('pwError');
    const successEl = document.getElementById('pwSuccess');
    errorEl.textContent = '';
    successEl.textContent = '';

    const newPw = document.getElementById('newPassword').value;
    const confirmPw = document.getElementById('confirmPassword').value;

    if (newPw.length < 6) {
      errorEl.textContent = 'رمز عبور باید حداقل ۶ کاراکتر باشه.';
      return;
    }
    if (newPw !== confirmPw) {
      errorEl.textContent = 'تکرار رمز با رمز جدید یکی نیست.';
      return;
    }

    const { error } = await sb.auth.updateUser({ password: newPw });
    if (error) {
      errorEl.textContent = 'خطا: ' + error.message;
      return;
    }
    successEl.textContent = 'رمز عبور با موفقیت تغییر کرد.';
    document.getElementById('newPassword').value = '';
    document.getElementById('confirmPassword').value = '';
  });
}
</script>
</body>
</html>
