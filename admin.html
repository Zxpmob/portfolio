<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Zxpmob</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Vazirmatn:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root {
    --bg: #060613; --surface: #11112a; --surface-solid: #16163a; --border: #26264c;
    --text: #eef0ff; --text-muted: #9797bb; --text-dim: #6a6a8f; --violet: #a78bfa;
    --grad: linear-gradient(135deg, #7c6cf6 0%, #4f8cff 100%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); font-family: 'Vazirmatn', sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .wrap { width: 100%; max-width: 480px; }
  .wrap.wide { max-width: 780px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 34px 30px;
  }
  .logo { font-weight: 800; font-size: 1.3rem; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 6px; display: block; text-align: center; }
  .subtitle { text-align: center; color: var(--text-dim); font-size: .85rem; margin-bottom: 26px; }
  input {
    width: 100%; padding: 13px 16px; background: var(--surface-solid); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-family: inherit; font-size: .92rem; margin-bottom: 12px;
  }
  input:focus { outline: none; border-color: var(--violet); }
  button {
    width: 100%; padding: 13px; border: none; border-radius: 10px; background: var(--grad); color: #fff;
    font-family: inherit; font-weight: 700; font-size: .92rem; cursor: pointer; transition: opacity .2s ease;
  }
  button:hover { opacity: .92; }
  button:disabled { opacity: .5; cursor: default; }
  .error-msg { color: #ff8a8a; font-size: .82rem; margin-top: 10px; text-align: center; min-height: 1em; }
  .config-warning {
    background: rgba(255,138,138,.08); border: 1px solid rgba(255,138,138,.3); color: #ff8a8a;
    padding: 14px 16px; border-radius: 10px; font-size: .82rem; margin-bottom: 20px; line-height: 1.8;
  }

  .dash-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .dash-title { font-weight: 800; font-size: 1.3rem; }
  .dash-actions { display: flex; gap: 10px; }
  .btn-ghost {
    width: auto; padding: 9px 16px; background: var(--surface-solid); border: 1px solid var(--border);
    color: var(--text-muted); font-size: .82rem; font-weight: 600;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--violet); }

  .msg-list { display: flex; flex-direction: column; gap: 12px; }
  .msg-card { background: var(--surface-solid); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
  .msg-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
  .msg-name { font-weight: 700; }
  .msg-email { font-family: 'JetBrains Mono', monospace; font-size: .78rem; color: var(--violet); }
  .msg-date { font-size: .74rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
  .msg-body { color: var(--text-muted); font-size: .9rem; white-space: pre-wrap; line-height: 1.7; }
  .empty-state { text-align: center; color: var(--text-dim); padding: 60px 20px; font-size: .92rem; }
  .loading { text-align: center; color: var(--text-dim); padding: 40px; font-size: .9rem; }
</style>
</head>
<body>

  <div class="wrap" id="configWrap" style="display:none;">
    <div class="card">
      <span class="logo">Zxpmob</span>
      <div class="config-warning">
        اطلاعات Supabase هنوز توی <code>supabase-config.js</code> تنظیم نشده. اول SUPABASE_URL و SUPABASE_ANON_KEY رو پر کن، بعد این صفحه رو دوباره باز کن.
      </div>
    </div>
  </div>

  <div class="wrap" id="loginWrap" style="display:none;">
    <div class="card">
      <span class="logo">Zxpmob</span>
      <p class="subtitle">ورود به پنل مدیریت</p>
      <input type="email" id="loginEmail" placeholder="ایمیل" autocomplete="username">
      <input type="password" id="loginPassword" placeholder="رمز عبور" autocomplete="current-password">
      <button id="loginBtn">ورود</button>
      <p class="error-msg" id="loginError"></p>
    </div>
  </div>

  <div class="wrap wide" id="dashWrap" style="display:none;">
    <div class="dash-header">
      <span class="dash-title">پیام‌های دریافتی</span>
      <div class="dash-actions">
        <button class="btn-ghost" id="refreshBtn">به‌روزرسانی</button>
        <button class="btn-ghost" id="logoutBtn">خروج</button>
      </div>
    </div>
    <div class="msg-list" id="msgList">
      <div class="loading">در حال بارگذاری...</div>
    </div>
  </div>

<script>
const configWrap = document.getElementById('configWrap');
const loginWrap = document.getElementById('loginWrap');
const dashWrap = document.getElementById('dashWrap');

const isConfigured = typeof SUPABASE_URL !== 'undefined' &&
  SUPABASE_URL && !SUPABASE_URL.includes('YOUR-PROJECT');

if (!isConfigured) {
  configWrap.style.display = 'block';
} else {
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showLogin() {
    dashWrap.style.display = 'none';
    loginWrap.style.display = 'block';
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleString('fa-IR', { dateStyle: 'medium', timeStyle: 'short' });
  }

  async function loadMessages() {
    const listEl = document.getElementById('msgList');
    listEl.innerHTML = '<div class="loading">در حال بارگذاری...</div>';

    const { data, error } = await sb
      .from('messages')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      listEl.innerHTML = `<div class="empty-state">خطا در دریافت پیام‌ها: ${error.message}</div>`;
      return;
    }

    if (!data || data.length === 0) {
      listEl.innerHTML = '<div class="empty-state">هنوز پیامی ثبت نشده.</div>';
      return;
    }

    listEl.innerHTML = data.map(m => `
      <div class="msg-card">
        <div class="msg-top">
          <span class="msg-name">${escapeHtml(m.name)}</span>
          <span class="msg-email">${escapeHtml(m.email)}</span>
          <span class="msg-date">${formatDate(m.created_at)}</span>
        </div>
        <div class="msg-body">${escapeHtml(m.message)}</div>
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  async function showDashboard() {
    loginWrap.style.display = 'none';
    dashWrap.style.display = 'block';
    await loadMessages();
  }

  document.getElementById('loginBtn').addEventListener('click', attemptLogin);
  document.getElementById('loginPassword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') attemptLogin();
  });

  async function attemptLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorEl = document.getElementById('loginError');
    errorEl.textContent = '';

    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      errorEl.textContent = 'ورود ناموفق بود — ایمیل یا رمز اشتباهه.';
      return;
    }
    showDashboard();
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    showLogin();
  });

  document.getElementById('refreshBtn').addEventListener('click', loadMessages);

  // On load, check if already logged in (session persists in browser storage)
  sb.auth.getSession().then(({ data }) => {
    if (data.session) {
      showDashboard();
    } else {
      showLogin();
    }
  });
}
</script>
</body>
</html>
